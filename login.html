<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>SportHub — Đăng nhập</title>
<meta name="description" content="Đăng nhập SportHub — một tài khoản duy nhất để đặt sân, theo dõi lịch đấu và nhận ưu đãi." />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --background:#ffffff; --foreground:#0a0a0a;
  --brand:#2563c9; --brand-deep:#0f2f63; --brand-light:#5790e6;
  --accent:#ff4d12; --accent-dark:#e03e00;
  --surface:#f4f4f4; --surface-card:#ffffff;
  --ink:#0a0a0a; --ink-soft:#717784; --ghost:#d7dae1; --hairline:#e6e8ec;
  --on-brand:#ffffff;
  --radius-card:1.5rem; --radius-card-lg:2rem; --radius-pill:62.5rem;
  --ease-expo:cubic-bezier(0.16,1,0.3,1);
  --spring:cubic-bezier(0.22,1,0.36,1);
}
html{font-size:16px}
@media (max-width:1920px){html{font-size:0.833333vw}}
@media (max-width:1440px){html{font-size:1.111111vw}}
@media (max-width:1024px){html{font-size:1.5625vw}}
@media (max-width:640px){html{font-size:4.444444vw}}
*{box-sizing:border-box;margin:0;padding:0}
img{display:block;max-width:100%}
body{min-height:100vh;background:var(--brand-deep);color:var(--foreground);font-family:"Onest",system-ui,sans-serif;font-weight:400;overflow-x:clip;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{cursor:pointer;font-family:inherit;background:none;border:none;color:inherit}
:focus-visible{outline:2px solid var(--brand-light);outline-offset:2px}
/* ---------- LOADER (same language as index_2.html) ---------- */
#loader{position:fixed;inset:0;z-index:200;background:var(--brand-deep);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2rem;transition:transform .65s cubic-bezier(0.65,0,0.35,1)}
#loader.done{transform:translateY(-105%)}
#loader .wm{display:flex;align-items:center;gap:0.75rem;font-size:1.5rem;font-weight:500;text-transform:uppercase;letter-spacing:0.2em}
#loader .wm svg{width:1.75rem;height:1.75rem}
#loader .track{width:10rem;height:1px;border-radius:var(--radius-pill);background:rgba(255,255,255,.2);overflow:hidden}
#loader .fill{height:100%;width:100%;background:#fff;border-radius:inherit;transform:scaleX(0);transform-origin:left;transition:transform 1s cubic-bezier(0.65,0,0.35,1) .1s}
/* ---------- PAGE ---------- */
.auth-page{position:relative;isolation:isolate;min-height:100svh;display:flex;align-items:center;justify-content:center;padding:5rem 1rem 2.5rem;overflow:hidden}
.auth-bg{position:absolute;inset:0;z-index:-1;overflow:hidden}
.auth-bg img{width:100%;height:100%;object-fit:cover}
.auth-shade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(15,47,99,.72),rgba(15,47,99,.42),rgba(15,47,99,.8))}
.backFab{position:absolute;top:1.25rem;left:1.25rem;z-index:2;display:inline-flex;align-items:center;gap:.5rem;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.22);color:#fff;font-size:.78rem;font-weight:500;text-transform:uppercase;letter-spacing:.06em;border-radius:var(--radius-pill);padding:.65rem 1.1rem;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);transition:background .3s,transform .3s var(--spring)}
.backFab:hover{background:rgba(255,255,255,.22);transform:translateY(-1px)}
/* ---------- GLASS CARD ---------- */
.auth-card{width:100%;max-width:26rem;background:rgba(255,255,255,.94);border:1px solid rgba(255,255,255,.5);border-radius:var(--radius-card-lg);padding:2rem;box-shadow:0 3rem 6rem -2rem rgba(0,0,0,.55),inset 0 1px 0 rgba(255,255,255,.7);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);animation:fadeUp .6s var(--spring)}
@keyframes fadeUp{from{opacity:0;transform:translateY(1.2rem) scale(.98)}to{opacity:1;transform:none}}
@media(min-width:640px){.auth-card{padding:2.25rem}}
.authBrand{display:flex;align-items:center;justify-content:center;gap:.55rem;font-weight:500;text-transform:uppercase;letter-spacing:.2em;font-size:1rem;color:var(--brand-deep);margin-bottom:1.5rem}
.authBrand svg{width:1.5rem;height:1.5rem}
.authBrand:hover{color:var(--brand)}
.auth-card h1{font-size:1.6rem;font-weight:500;letter-spacing:-0.02em;color:var(--ink);text-align:center}
.authSub{font-size:.875rem;color:var(--ink-soft);margin:.4rem 0 1.4rem;text-align:center;line-height:1.6}
.modal-form{display:flex;flex-direction:column;gap:1rem}
.flabel{font-size:.75rem;font-weight:500;text-transform:uppercase;letter-spacing:.18em;color:var(--ink-soft);display:block;margin-bottom:.4rem}
.finput{width:100%;border-radius:.75rem;border:1px solid var(--hairline);background:#fff;padding:.75rem 1rem;font-size:.875rem;font-family:inherit;color:var(--ink);outline:none;transition:border-color .25s,box-shadow .25s}
.finput::placeholder{color:#9aa1ad}
.finput:focus{border-color:#5790e6;box-shadow:0 0 0 4px rgba(87,144,230,.2)}
.pwWrap{position:relative}
.pwWrap .finput{padding-right:2.8rem}
.eye{position:absolute;right:.4rem;top:50%;transform:translateY(-50%);width:2rem;height:2rem;display:grid;place-items:center;border-radius:50%;color:var(--ink-soft);transition:background .25s,color .25s}
.eye:hover{background:var(--surface);color:var(--ink)}
.eye svg{width:1.1rem;height:1.1rem}
.eye.off svg{opacity:.4}
.authRow{display:flex;justify-content:space-between;align-items:center;gap:1rem;font-size:.8rem}
.chk{display:inline-flex;align-items:center;gap:.5rem;color:var(--ink-soft);cursor:pointer;user-select:none;position:relative}
.chk input{position:absolute;opacity:0;width:0;height:0}
.chk .box{width:1.05rem;height:1.05rem;border-radius:.35rem;border:1.5px solid var(--hairline);background:#fff;display:grid;place-items:center;transition:background .2s,border-color .2s;flex-shrink:0}
.chk .box svg{width:.65rem;height:.65rem;opacity:0;transition:opacity .2s}
.chk input:checked + .box{background:#ff4d12;border-color:#ff4d12}
.chk input:checked + .box svg{opacity:1}
.chk input:focus-visible + .box{outline:2px solid var(--brand-light);outline-offset:2px}
.linkBtn{color:var(--brand);font-size:.8rem;font-weight:500}
.linkBtn:hover{text-decoration:underline}
.ferr{font-size:.75rem;color:#dc2626;min-height:1.1rem;margin-top:.1rem}
.authSubmit{width:100%;display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:#ff4d12;color:#fff;border-radius:var(--radius-pill);padding:.875rem 1.75rem;font-size:.875rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;transition:background .3s,transform .3s var(--spring),box-shadow .3s;box-shadow:0 .8rem 1.8rem -.8rem rgba(255,77,18,.7)}
.authSubmit:hover{background:#0f2f63;color:#fff;transform:translateY(-1px);box-shadow:0 1rem 2rem -.8rem rgba(15,47,99,.6)}
.authSubmit:disabled{opacity:.6;transform:none}
.orRow{display:flex;align-items:center;gap:.8rem;color:var(--ink-soft);font-size:.75rem;margin:1.3rem 0 .9rem}
.orRow span{flex:1;height:1px;background:var(--hairline)}
.socRow{display:grid;grid-template-columns:1fr 1fr;gap:.6rem}
.socBtn{display:inline-flex;align-items:center;justify-content:center;gap:.5rem;background:#fff;border:1px solid var(--hairline);border-radius:.9rem;padding:.7rem;font-size:.85rem;font-weight:500;transition:border-color .25s,transform .25s var(--spring)}
.socBtn:hover{border-color:var(--ink);transform:translateY(-1px)}
.socBtn svg{width:1.05rem;height:1.05rem}
.switcher{text-align:center;font-size:.85rem;color:var(--ink-soft);margin-top:1.3rem}
.switcher a{color:#ff4d12;font-weight:500}
.switcher a:hover{text-decoration:underline}
.fineprint{text-align:center;font-size:.72rem;color:var(--ink-soft);margin-top:1rem;line-height:1.5}
/* ---------- TOAST ---------- */
#toastWrap{position:fixed;top:1rem;right:1rem;z-index:130;display:flex;flex-direction:column;gap:.6rem;align-items:flex-end;pointer-events:none}
.toast{display:flex;align-items:center;gap:.6rem;background:#0f172a;color:#fff;font-size:.85rem;font-weight:500;border-radius:.9rem;padding:.8rem 1.1rem;box-shadow:0 1.2rem 2.5rem -1rem rgba(15,23,42,.5);opacity:0;transform:translateX(1rem);transition:opacity .4s var(--spring),transform .4s var(--spring);max-width:20rem}
.toast.show{opacity:1;transform:none}
.toast .tick{width:1.4rem;height:1.4rem;border-radius:50%;background:#ff4d12;display:grid;place-items:center;flex-shrink:0}
.toast .tick svg{width:.75rem;height:.75rem}
@media (prefers-reduced-motion:reduce){*{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>
</head>
<body>
<div id="loader" aria-hidden="true">
  <div class="wm">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="2.2"/></svg>
    <span>SportHub</span>
  </div>
  <div class="track"><div class="fill" id="loaderFill"></div></div>
</div>

<div class="auth-page">
  <div class="auth-bg" aria-hidden="true">
    <img src="https://images.unsplash.com/photo-1522778119026-d647f0596c20?w=2000&q=80&auto=format&fit=crop" alt="" fetchpriority="high" />
    <div class="auth-shade"></div>
  </div>
  <a class="backFab" href="index_2.html">&#8592; Trang ch&#7911;</a>

  <main class="auth-card" role="main" aria-labelledby="loginTitle">
    <a class="authBrand" href="index_2.html" aria-label="SportHub Trang ch&#7911;">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 3v18M3 12h18"/><circle cx="12" cy="12" r="2.2"/></svg>
      <span>SportHub</span>
    </a>
    <h1 id="loginTitle">ĐĂNG NHẬP</h1>
    <p class="authSub">Một tài khoản duy nhất — đặt sân, theo dõi lịch đấu &amp; nhận ưu đãi.</p>
    <form class="modal-form" id="loginForm" novalidate>
      <div>
        <label class="flabel" for="loginContact">Email / S&#7889; &#273;i&#7879;n tho&#7841;i</label>
        <input class="finput" id="loginContact" type="text" placeholder="ten@email.com ho&#7863;c 0901234567" autocomplete="username" />
      </div>
      <div>
        <label class="flabel" for="loginPw">M&#7853;t kh&#7849;u</label>
        <div class="pwWrap">
          <input class="finput" id="loginPw" type="password" placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;" autocomplete="current-password" />
          <button type="button" class="eye" data-eye="loginPw" aria-label="Hi&#7879;n m&#7853;t kh&#7849;u"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
        </div>
      </div>
      <div class="authRow">
        <label class="chk"><input type="checkbox" id="rememberMe" checked /><span class="box"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg></span>Ghi nh&#7899; &#273;&#259;ng nh&#7853;p</label>
        <button type="button" class="linkBtn" id="forgotPw">Qu&ecirc;n m&#7853;t kh&#7849;u?</button>
      </div>
      <div class="ferr" id="loginErr" role="alert"></div>
      <button class="authSubmit" type="submit" id="loginBtn">ĐĂNG NHẬP ↗</button>
    </form>
    <div class="orRow"><span></span>Ho&#7863;c &#273;&#259;ng nh&#7853;p b&#7857;ng<span></span></div>
    <div class="socRow">
      <button type="button" class="socBtn" data-social="google"><svg viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>Google</button>
      <button type="button" class="socBtn" data-social="apple"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.36 12.76c0-2.3 1.88-3.4 1.97-3.45-1.07-1.57-2.74-1.78-3.34-1.81-1.42-.14-2.77.84-3.49.84-.72 0-1.83-.82-3.02-.8-1.55.02-2.98.9-3.78 2.29-1.61 2.8-.41 6.94 1.16 9.21.76 1.1 1.67 2.34 2.87 2.3 1.15-.05 1.59-.74 2.98-.74s1.78.74 3 .72c1.24-.02 2.02-1.12 2.78-2.23.88-1.28 1.24-2.52 1.26-2.59-.03-.01-2.42-.93-2.39-3.74zM14.16 5.53c.64-.77 1.07-1.84.95-2.91-.92.04-2.03.61-2.69 1.38-.59.68-1.11 1.77-.97 2.81 1.02.08 2.07-.52 2.71-1.28z"/></svg>Apple</button>
    </div>
    <p class="switcher">Ch&#432;a c&oacute; t&agrave;i kho&#7843;n? <a id="toRegister" href="register-user.html">&#272;&#259;ng k&yacute; ngay</a></p>
    <p class="fineprint">Bằng việc tiếp tục, bạn đồng ý với Điều khoản &amp; Chính sách của SportHub.</p>
  </main>
</div>

<div id="toastWrap" aria-live="polite"></div>

<script type="module">
// FILE: login.html — Unified customer login (single primary login, replaces router + login-provider.html)
// Target endpoint: POST /api/v1/auth/login
const AUTH_KEY = 'sporthub_user';
const LOGIN_ENDPOINT = '/api/v1/auth/login';
const params = new URLSearchParams(location.search);

function getRedirect(){
  const next = params.get('next') || params.get('redirect') || params.get('from') || params.get('returnUrl');
  if(next) return next;
  try{ if(document.referrer && document.referrer.includes('profile.html')) return 'profile.html'; }catch(e){}
  return 'index_2.html'; // prod: '/' or '/profile'
}
(function preserveNext(){
  const next = params.get('next') || params.get('redirect') || params.get('from');
  if(next){
    const a = document.getElementById('toRegister');
    if(a) a.href = 'register-user.html?next=' + encodeURIComponent(next);
  }
})();
function toast(msg){
  const w = document.getElementById('toastWrap');
  const t = document.createElement('div');
  t.className = 'toast';
  t.innerHTML = '<span class="tick"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"><path d="M5 13l4 4L19 7"/></svg></span><span></span>';
  t.lastChild.textContent = msg;
  w.appendChild(t);
  requestAnimationFrame(()=>t.classList.add('show'));
  setTimeout(()=>{ t.classList.remove('show'); setTimeout(()=>t.remove(),450); }, 3200);
}
function validContact(c){ return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c) || /^[0-9+\s.()-]{9,15}$/.test(c); }
function prettyName(contact){
  const c = (contact||'').trim();
  if(c.includes('@')){ return c.split('@')[0].split(/[._-]+/).filter(Boolean).map(w=>w.charAt(0).toUpperCase()+w.slice(1)).join(' ') || 'Thành viên'; }
  const d = c.replace(/\D/g,'');
  return 'Người chơi ' + (d.slice(-4) || 'mới');
}
function saveSession(u, remember){
  // Unified session namespace. remember=false -> sessionStorage only (profile guard falls back to session).
  try{
    if(remember === false){ sessionStorage.setItem(AUTH_KEY, JSON.stringify(u)); localStorage.removeItem(AUTH_KEY); }
    else{ localStorage.setItem(AUTH_KEY, JSON.stringify(u)); }
  }catch(e){}
}

document.addEventListener('click', (e)=>{
  const eyeBtn = e.target.closest('[data-eye]');
  if(eyeBtn){
    const inp = document.getElementById(eyeBtn.dataset.eye);
    if(inp){ inp.type = inp.type === 'password' ? 'text' : 'password'; eyeBtn.classList.toggle('off', inp.type === 'password'); }
    return;
  }
  const socBtn = e.target.closest('[data-social]');
  if(socBtn){
    // DEMO: bỏ qua đăng nhập — nhấn là chuyển trang
    location.href = getRedirect();
  }
});
document.getElementById('forgotPw').addEventListener('click', ()=> toast('Liên kết đặt lại mật khẩu đã gửi qua SMS!'));
document.getElementById('loginForm').addEventListener('submit', (e)=>{
  // DEMO: bỏ qua đăng nhập — nhấn nút là chuyển trang, không validate / không gọi API
  e.preventDefault();
  location.href = getRedirect();
});
const fill = document.getElementById('loaderFill');
const loader = document.getElementById('loader');
requestAnimationFrame(()=>{ if(fill) fill.style.transform = 'scaleX(1)'; });
setTimeout(()=>{ loader.classList.add('done'); setTimeout(()=>loader.remove(), 700); }, 900);
</script>
</body>
</html>
